envVarGroups:
  - name: consman-production
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: consman-rauniyaraman-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://consman.rauniyaraman.com.np
      - key: PUBLIC_FORM_ORIGIN
        value: https://consman.rauniyaraman.com.np
      - key: PUBLIC_ALLOWED_ORIGINS
        value: https://consman.rauniyaraman.com.np
      - key: TURNSTILE_HOSTNAME
        value: consman.rauniyaraman.com.np
services:
  - type: web
    name: consman-rauniyaraman-api
    runtime: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/v1/health/
    dockerCommand: python deployment/start_free.py
    envVars:
      - fromGroup: consman-production
